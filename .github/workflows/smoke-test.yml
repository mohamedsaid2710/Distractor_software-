name: smoke-test

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The wiki is a separate repository behind a submodule. Without this
          # it was never checked out in CI, which is the structural reason the
          # documentation drifted from the code unnoticed.
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # --locked: fail if uv.lock no longer matches pyproject.toml, instead of
      # quietly re-resolving -- the lockfile is what makes runs reproducible.
      - name: Install dependencies
        run: uv sync --locked

      # No model weights and no network needed: the end-to-end test runs the
      # whole pipeline in all three languages with a stand-in language model.
      - name: Run tests
        run: uv run python -m pytest -q

      # The installed package must carry its code AND the POS lexicons; a
      # wheel without them installs but cannot run.
      - name: Verify the built wheel contains the code and the lexicons
        run: |
          uv build --wheel -o dist
          uv run python - <<'PY'
          import glob, zipfile, sys
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          need = ["maze_automate/pipeline.py", "maze_automate/scoring/hf_scorer.py",
                  "maze_automate/lexicons/en.json", "maze_automate/lexicons/de.json",
                  "maze_automate/lexicons/ar.json"]
          missing = [n for n in need if n not in names]
          print(f"{len(names)} files in the wheel")
          if missing:
              sys.exit(f"wheel is missing {missing} -- check [tool.setuptools] in pyproject.toml")
          PY
