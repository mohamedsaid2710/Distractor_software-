[project]
name = "maze-automate"
version = "1.0.2"
description = "Maze-style distractor stimulus generator for psycholinguistic experiments in English, German, and Arabic"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "huggingface-hub>=0.20.0",
    "spacy>=3.5.0",
    "numpy>=2.0.0",
    "wordfreq>=3.0.0",
    "fasttext>=0.9.2",
    "stanza>=1.8.0",
    "farasapy>=0.0.14",
    "HanTa>=0.2.0",
    "en_core_web_lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repo is flat: modules import each other assuming the root is importable.
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = []
exclude = ["wiki*", "models*"]

# The PyTorch CUDA 11.8 mirror also serves its own (frozen, years-old) copies of
# common packages such as certifi, requests and urllib3. Without `explicit = true`
# uv prefers the first index that serves a name, so those stale copies were being
# resolved for the whole dependency tree. Keep it reachable for torch only.
[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
