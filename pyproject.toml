[project]
name = "maze-automate"
version = "2.0.0"
description = "Maze-style distractor stimulus generator for psycholinguistic experiments in English, German, and Arabic"
readme = "README.md"
license = {text = "MIT (code); POS lexicons under their sources' terms, see src/maze_automate/lexicons/LICENSE.md"}
requires-python = ">=3.12"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "huggingface-hub>=0.20.0",
    "spacy>=3.5.0",
    "numpy>=2.0.0",
    "wordfreq>=3.0.0",
    # Everything the pipeline uses is a core dependency, so `uv sync` (or
    # `pip install .`) gives a complete install for all three languages.
    # These used to be per-language extras; a plain `uv sync` then lacked
    # Stanza, and German/Arabic target sentences went untagged.
    #
    # Input-sentence taggers (targets, in context).  stanza >= 1.10: earlier
    # releases call torch.load() without weights_only=False, which
    # PyTorch >= 2.6 rejects, so German and Arabic failed on every item while
    # the run still exited 0.
    "en_core_web_lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl",
    "stanza>=1.10.0",
    # German fallback candidate tagger, used only when no POS lexicon file is
    # present (the shipped lexicons come from lexical norms).
    "HanTa>=0.2.0",
    # fastText semantic dissimilarity filter (`semantic_filter: True`). The
    # vectors are ~7 GB PER LANGUAGE, downloaded on first use; see
    # download_model.py -p <params file>.
    "fasttext>=0.9.2",
    # German spaCy model for assess_output.py.
    "de_core_news_sm @ https://github.com/explosion/spacy-models/releases/download/de_core_news_sm-3.8.0/de_core_news_sm-3.8.0-py3-none-any.whl",
    # Building the POS lexicons from lexical norms (build_lexicon.py):
    # SUBTLEX-US is an Excel file; Arabic POS comes from CAMeL Tools, whose
    # data (~540 MB) is fetched with `camel_data -i light`.
    "openpyxl>=3.1",
    "camel-tools>=1.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The code is the src/maze_automate package; tests/fake_lm.py is imported by
# name from the params override in the end-to-end test; tools/ holds the
# command-line tools (ibexify is tested).
pythonpath = ["src", "tests", "tools"]

[project.scripts]
# Same as `python run_pipeline.py`; the tools in tools/ are run as scripts.
maze-run = "maze_automate.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# src layout: all code is the `maze_automate` package under src/, and the
# POS lexicons ship inside it as package data.
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
maze_automate = ["lexicons/*.json", "lexicons/LICENSE.md", "lexicons/GPL-2.0.txt"]

# The PyTorch CUDA 11.8 mirror also serves its own (frozen, years-old) copies of
# common packages such as certifi, requests and urllib3. Without `explicit = true`
# uv prefers the first index that serves a name, so those stale copies were being
# resolved for the whole dependency tree. Keep it reachable for torch only.
[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
